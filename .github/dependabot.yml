# Grouped weekly updates; every PR is checked by the "ci" workflow before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Athens }
    open-pull-requests-limit: 5
    groups:
      production: { dependency-type: production, update-types: [minor, patch] }
      development: { dependency-type: development, update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Athens }
    open-pull-requests-limit: 3
